# Existing PostgreSQL: reads PG_* from .env and never starts another database.
name: sls-orcamento-pdd-remote
services:
  pipeline:
    build: .
    env_file: .env
    environment:
      RUNTIME_DIR: /app/runtime
      MONDAY_HTTP_TRANSPORT: ${DOCKER_HTTP_TRANSPORT:-requests}
    volumes:
      - runtime_data:/app/runtime
    command: ["daily"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  backup:
    image: postgres:17-alpine
    profiles: [backup]
    env_file: .env
    entrypoint:
      - sh
      - -ec
      - |
        test -z "$${PG_DSN:-}" || { echo 'Backup requer PG_* e PG_DSN vazio' >&2; exit 1; }
        export PGHOST="$$PG_HOST" PGPORT="$$PG_PORT" PGDATABASE="$$PG_DB"
        export PGUSER="$$PG_USER" PGPASSWORD="$$PG_PASSWORD" PGSSLMODE="$${PG_SSLMODE:-prefer}"
        exec pg_dump --format=custom --no-owner --no-privileges --schema="$$PG_SCHEMA"
volumes:
  runtime_data:
networks:
  default:
    name: ${PIPELINE_DOCKER_NETWORK:-sls-orcamento-pdd-remote_default}
    external: ${PIPELINE_NETWORK_EXTERNAL:-false}
