name: sls-orcamento-pdd
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-sla_workflow}
      POSTGRES_USER: ${PG_USER:-sla_pipeline}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Defina PG_PASSWORD no .env}
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  pipeline:
    build: .
    profiles: ["job"]
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      RUNTIME_DIR: /app/runtime
      MONDAY_HTTP_TRANSPORT: ${DOCKER_HTTP_TRANSPORT:-requests}
    volumes:
      - runtime_data:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
    command: ["daily"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_data:
  runtime_data:
