[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sls-orcamento-pdd"
version = "3.0.1"
description = "Pipeline Monday Bronze/Silver/Gold para SLA de projetos"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "requests>=2.32,<3", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
bigquery = ["google-cloud-bigquery>=3.30,<4"]

[project.scripts]
sla-pipeline = "sls_orcamento_pdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
