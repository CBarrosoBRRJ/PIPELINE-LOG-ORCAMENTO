[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sls-orcamento-ppd"
version = "4.0.0"
description = "Monday para sla_orcamento no BigQuery, executado em Cloud Run Jobs"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.7,<3", "requests>=2.32,<3", "tzdata>=2025.1",
  "google-cloud-bigquery>=3.45.1,<4", "google-cloud-storage>=3.14.1,<4", "holidays==0.104"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
migration = ["psycopg[binary]>=3.2,<4"] # Read-only import from the former PostgreSQL.

[project.scripts]
sla-pipeline = "sls_orcamento_ppd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
